spring.application.name=emstest

# H2 in-memory DB for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT
security.jwt.secret-key=T1NNRUxIT1JFU0JPTFNFSVJPU0RPVEVDTklDT1NBT09TRE9ERUkjQkVTVEJPTFNFSVJPU0VWRVIjT1BFUkFTRklYRTEyMw==
security.jwt.expiration-ms=86400000


# File Upload Paths for test
exam.upload.path=./target/test-uploads/exams
question.upload.path=./target/test-uploads/questions
